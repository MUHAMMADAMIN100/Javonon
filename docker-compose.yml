services:
  postgres:
    image: postgres:16-alpine
    container_name: javonon-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: javonon
      POSTGRES_USER: javonon
      POSTGRES_PASSWORD: javonon
    ports:
      - "5432:5432"
    volumes:
      - javonon_pgdata:/var/lib/postgresql/data

volumes:
  javonon_pgdata:
